# Build the front end and publish it to Azure Static Web Apps.
#
# The site being reachable by anyone is not a hole. It is HTML and JavaScript
# carrying no credentials, and it can do nothing without a token the edge
# accepts. What must never be openly usable is the pipeline that makes songs,
# and that is guarded on the machine that runs it, against an allowlist of
# named accounts.
#
# Setting this up is in docs/WORKFLOWS.md under "Put the site online".

trigger:
  branches:
    include:
      - main
  paths:
    # The audio pipeline is most of this repository and has nothing to do with
    # the site. Building it on every commit would burn the free minutes on
    # changes that cannot affect what gets published.
    #
    # `web`, not `web/*`. What a trailing `*` matches here is not settled:
    # Microsoft documents `*` as not crossing a directory separator, which
    # would exclude everything under `web/src`, and older servers as treating
    # the starred form as the directory itself, which would include it. The
    # directory on its own means everything beneath it under every reading,
    # which is what was intended.
    #
    # It is written this way because a front end was rewritten, merged and
    # never published while the filter read `web/*`, and because every deploy
    # this site has had came from a commit that also touched this file. That
    # the filter was the whole cause is not proven; see docs/WORKFLOWS.md
    # under "Put the site online" for the check and for where to look next.
    include:
      - web
      - azure-pipelines.yml

# No validation build on pull requests. The free grant is 1800 minutes a month
# and the suite already runs here before anything is published, so a second run
# per pull request would spend them to learn the same thing twice. Worth
# revisiting if this ever has more than one person pushing to it.
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # Overridable when running the pipeline by hand, so a second site can be
  # published without editing this file.
  - name: outputPath
    value: web/dist/songgen-web/browser

  # Where the browser sends its requests.
  #
  # This was a variable in the pipeline UI, so that a home machine's address
  # did not live in git history. It no longer is one: the edge is reached
  # through a proxy on a domain that is already named all over this repository,
  # and hiding a public hostname buys nothing.
  #
  # Committing it also removes a trap. Editing a variable in the UI does not
  # start a build, and config.json is written during one, so the value changed
  # and the site did not, which looks exactly like the change not working.
  # Here, a push to this file triggers the deploy that applies it.
  #
  # The name deliberately differs from the old API_BASE_URL. A variable set in
  # the pipeline UI overrides one set here, so reusing the name would leave the
  # stale UI value winning silently.
  - name: apiBaseUrl
    value: https://mikkonumminen.dev/api/songgen

steps:
  - task: NodeTool@0
    displayName: Node 22
    inputs:
      versionSpec: '22.x'

  - script: npm ci
    displayName: Install
    workingDirectory: web

  # Before anything is published. A green site with a broken front end is
  # worse than no site.
  - script: npm test -- --watch=false
    displayName: Test
    workingDirectory: web

  # No --base-href. A Static Web App serves from the root of its own hostname,
  # unlike a GitHub project page, so the default is right and passing a path
  # here would 404 every script after the page loaded.
  #
  # It carried `--base-href /songGenerator/` for a while, for a proxy that was
  # going to serve the app under a subpath. It does not: mikkonumminen.dev
  # redirects `/songgenerator` here rather than proxying it, so the browser
  # ends up on this hostname and the root is correct. A prefix would have
  # pointed every asset at a path nothing serves.
  #
  # Only a proxy that keeps the subpath in the address bar would need it, and
  # nothing does that today. See docs/TODO.md.
  - script: npx ng build
    displayName: Build
    workingDirectory: web

  # Where the edge is and which client id signs people in. Neither value is
  # secret and neither can be: the browser has to know where to send requests,
  # so both are in the shipped files however they get there. The allowlist on
  # the edge is the protection.
  #
  # The address comes from the variables block above; the client id is still a
  # pipeline variable, since it belongs to the deployment rather than to this
  # file.
  #
  # Absent, the site falls back to the local backend and honestly reports that
  # nothing is answering, which is a state it renders properly.
  - script: |
      cat > "$(outputPath)/config.json" <<JSON
      {
        "apiBaseUrl": "$(apiBaseUrl)",
        "googleClientId": "$(GOOGLE_CLIENT_ID)"
      }
      JSON
      echo "wrote $(outputPath)/config.json"
      cat "$(outputPath)/config.json"
    displayName: Write the runtime config

  - task: AzureStaticWebApp@0
    displayName: Publish
    inputs:
      # Already built and tested above, so the task uploads rather than
      # building again with its own toolchain and its own idea of the config.
      skip_app_build: true
      app_location: $(outputPath)
      output_location: ''
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
