<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The router replaces this per page. It is the name of the project rather
       than the name npm generated, which is what shows in a bookmark and in
       the tab before the application has started. -->
  <title>SongGenerator</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Replaces a song's vocals with sung word clips, on the same notes, at the same moments.">
  <!-- The songs are somebody else's recordings and the machine that makes them
       is a desktop. Neither belongs in a search index. -->
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
