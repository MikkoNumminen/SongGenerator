[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "song-generator"
version = "0.1.0"
description = "Replace a song's vocals with sung Finnish word samples, timed and pitched to fit."
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Private :: Do Not Upload",
]
dependencies = [
    "torch",
    "torchaudio",
    "demucs>=4.1.0",
    "librosa>=0.11",
    "soundfile>=0.13",
    "numpy>=2.0",
    "torchcrepe>=0.0.24",
    "pyloudnorm>=0.2",
    "pyworld>=0.3.5",
    "pylibrb>=0.1.2",
    # Fetching songs from URLs (fetch.py). Sites change constantly and yt-dlp
    # tracks them, so no version ceiling: old pins here rot into "site not
    # supported" errors. Needs ffmpeg on PATH to merge video and audio.
    "yt-dlp",
]

[project.optional-dependencies]
# Mel-Band Roformer separation. Kept optional because it brings its own
# onnxruntime, which is easy to have collide with a torch CUDA install.
roformer = ["audio-separator[gpu]"]

# The HTTP edge under api/. Optional so installing the pipeline to use from the
# command line, which is most installs, does not drag in a web framework.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-auth>=2.35",
    "httpx>=0.27",              # FastAPI's TestClient is built on it
]

[project.scripts]
song-generator = "song_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Ruff's default rule selection is the baseline; the ignores below are the
# rules this codebase has looked at and decided against, with the reason each
# time. An entry here means "checked, and the flagged pattern is deliberate",
# never "too noisy to read".
ignore = [
    # int(round(x)) marks the spot where a float becomes an array index or a
    # sample count. round() only returns a plain int here because numpy defines
    # __round__ that way for its scalars; the explicit cast states the intent
    # at the call site instead of leaning on that, and survives an operand
    # growing an ndigits argument. All 45 sites were read; none is a defect.
    "RUF046",
    # zip(xs[:-1], xs[1:]) is the established idiom here and reads as the index
    # arithmetic this code does everywhere; itertools.pairwise() renames the
    # pattern without changing behaviour or cost.
    "RUF007",
    # Batch loops catch Exception on purpose so one bad source cannot end a
    # run over dozens of files; every site logs the failure and carries on,
    # and the comments at each site say so.
    "BLE001",
    # Both ffmpeg calls check returncode by hand and raise AudioError carrying
    # the decoded stderr, which tells the user more than the CalledProcessError
    # that check=True would raise.
    "PLW1510",
]

[tool.ruff.lint.isort]
# The codebase writes aliased names inside the same parenthesised import as
# everything else; without this the sorter tears each alias out into its own
# statement, which is churn with no reader benefit.
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
# So a module outside src/ that imports the pipeline is checked against the
# real thing rather than being waved through as an untyped import.
mypy_path = "src"

# The audio and ML dependencies ship without stubs. Missing type information
# for a library is a fact about the library, not a defect in this code, so it
# is recorded once here rather than suppressed import by import.
[[tool.mypy.overrides]]
module = [
    "audio_separator.*",
    "demucs.*",
    "librosa.*",
    "pylibrb",
    "pyloudnorm",
    "pyworld",
    "scipy.*",
    "soundfile",
    "google.auth.*",
    "google.oauth2.*",
    "torch",
    "torch.*",
    "torchcrepe",
    "whisper",
    "yt_dlp",
]
ignore_missing_imports = true
