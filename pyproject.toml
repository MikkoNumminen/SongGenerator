[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luokkaretki"
version = "0.1.0"
description = "Replace a song's vocals with sung Finnish word samples, timed and pitched to fit."
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch",
    "torchaudio",
    "demucs>=4.1.0",
    "librosa>=0.11",
    "soundfile>=0.13",
    "numpy>=2.0",
    "torchcrepe>=0.0.24",
    "pyloudnorm>=0.2",
    "pyworld>=0.3.5",
    "pylibrb>=0.1.2",
]

[project.optional-dependencies]
# Mel-Band Roformer separation. Kept optional because it brings its own
# onnxruntime, which is easy to have collide with a torch CUDA install.
roformer = ["audio-separator[gpu]"]

[project.scripts]
luokkaretki = "luokkaretki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
